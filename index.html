<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

margin:0;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins,sans-serif;
background:#ffd8ea;

}

.sky{

position:relative;
width:100%;
height:100%;
overflow:hidden;

background:linear-gradient(
180deg,
#ffd7ea,
#fff4f8,
#fffaf0
);

}

.content{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

text-align:center;

animation:fadeIn 2s;

}

h1{

font-size:4rem;

color:#ff4d88;

}

p{

font-size:1.4rem;

margin-top:15px;

color:#666;

}

.cloud{

position:absolute;

background:white;

border-radius:100px;

opacity:.8;

}

.cloud::before{

content:"";

position:absolute;

background:white;

border-radius:50%;

width:60px;

height:60px;

left:20px;

top:-25px;

}

.cloud::after{

content:"";

position:absolute;

background:white;

border-radius:50%;

width:80px;

height:80px;

right:20px;

top:-40px;

}

.cloud1{

width:180px;

height:70px;

top:80px;

left:-200px;

animation:moveCloud 35s linear infinite;

}

.cloud2{

width:250px;

height:90px;

top:220px;

left:-250px;

animation:moveCloud 45s linear infinite;

animation-delay:5s;

}

.cloud3{

width:160px;

height:60px;

top:420px;

left:-180px;

animation:moveCloud 28s linear infinite;

animation-delay:12s;

}

@keyframes moveCloud{

from{

transform:translateX(0);

}

to{

transform:translateX(1700px);

}

}

@keyframes fadeIn{

from{

opacity:0;
transform:translate(-50%,-40%);

}

to{

opacity:1;
transform:translate(-50%,-50%);

}

}
</style>

</head>
<body>

<div class="sky">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="content">

<h1>Hi Poorvi ❤️</h1>

<p>I have a little surprise for you...</p>

</div>

</div>

</body>
</html>
